# Render Blueprint Specification for CodeSync Monorepo
# This blueprint defines the database, redis cache, api server, websocket server, worker, and frontend.
# Reference: https://render.com/docs/blueprints

services:
  # 1. API Server (Express REST API)
  - type: web
    name: codesync-api
    env: node
    plan: starter # Starter plan recommended for API backend (needs persistent CPU)
    buildCommand: pnpm install && pnpm build --filter api-server
    startCommand: pnpm --filter api-server start
    envVars:
      - key: NODE_VERSION
        value: 20.20.2
      - key: PORT
        value: 3002
      - key: DATABASE_URL
        fromDatabase:
          name: codesync-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: codesync-redis
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        sync: false # Set to your production frontend URL (e.g., https://codesync-web.onrender.com)

  # 2. Collaboration Server (Socket.io Websockets + Y.js Syncing)
  - type: web
    name: codesync-collab
    env: node
    plan: starter
    buildCommand: pnpm install && pnpm build --filter collab-server
    startCommand: pnpm --filter collab-server start
    envVars:
      - key: NODE_VERSION
        value: 20.20.2
      - key: PORT
        value: 3001
      - key: REDIS_URL
        fromService:
          type: redis
          name: codesync-redis
          property: connectionString
      - key: JWT_SECRET
        sync: false # Must match JWT_SECRET from codesync-api
      - key: CORS_ORIGIN
        sync: false # Set to your production frontend URL

  # 3. Runner Service (BullMQ Background Worker)
  # NOTE: To execute user code sandboxes, this background worker needs access to a Docker daemon.
  # Since Render doesn't support local docker socket access (/var/run/docker.sock), you must set up
  # a remote Docker host (e.g. on a cheap VPS or EC2 instance) and provide the TLS credentials below.
  - type: worker
    name: codesync-runner
    env: node
    plan: starter
    buildCommand: pnpm install && pnpm build --filter runner-service
    startCommand: pnpm --filter runner-service start
    envVars:
      - key: NODE_VERSION
        value: 20.20.2
      - key: REDIS_URL
        fromService:
          type: redis
          name: codesync-redis
          property: connectionString
      # Configure connection to your remote Docker daemon:
      - key: DOCKER_HOST
        sync: false # e.g. tcp://your-remote-docker-ip:2376
      - key: DOCKER_TLS_VERIFY
        value: "1"
      - key: DOCKER_CERT_PATH
        sync: false # Path to directory containing remote ca.pem, cert.pem, key.pem

  # 4. Frontend Web Client (Static Hosting)
  - type: web
    name: codesync-web
    env: static
    buildCommand: pnpm install && pnpm build --filter web
    staticPublishPath: apps/web/dist
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: codesync-api
          property: host
      - key: VITE_COLLAB_URL
        fromService:
          type: web
          name: codesync-collab
          property: host

databases:
  # PostgreSQL Database Instance
  - name: codesync-db
    databaseName: codesync
    user: codesync
    plan: free

redis:
  # Redis Instance for Socket.io adapter & BullMQ job coordination
  - name: codesync-redis
    plan: free
    ipAllowList: [] # RESTRICT ACCESS: empty allows only internal Render services to connect
