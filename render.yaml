# Render Blueprint Specification for CodeSync Monorepo (100% FREE Deployment)
# This blueprint defines the database, redis cache, api server, and a combined collab + execution service.
# Reference: https://render.com/docs/blueprints

services:
  # 1. API Server (Express REST API)
  - type: web
    name: codesync-api
    env: node
    plan: free # Free tier (automatically sleeps after 15 minutes of inactivity)
    buildCommand: pnpm install && pnpm build --filter api-server
    startCommand: node apps/api-server/dist/index.js
    envVars:
      - key: NODE_VERSION
        value: 20.20.2
      - key: PORT
        value: 3002
      - key: DATABASE_URL
        fromDatabase:
          name: codesync-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: codesync-redis
          property: connectionString
      - key: JWT_SECRET
        sync: false
      - key: CORS_ORIGIN
        sync: false # Set to your production frontend URL (e.g., https://codesync-web.onrender.com)

  # 2. Collaboration & Runner Server (Socket.io + Y.js Syncing + Code Execution Worker)
  # Co-locating both servers in a single free Web Service container allows us to bypass the 
  # background worker restriction on Render and deploy the whole application 100% for free.
  - type: web
    name: codesync-collab
    env: node
    plan: free # Free tier (automatically sleeps after 15 minutes of inactivity)
    buildCommand: pnpm install && pnpm build --filter collab-server --filter runner-service
    startCommand: node apps/collab-server/dist/index.js & node apps/runner-service/dist/index.js
    envVars:
      - key: NODE_VERSION
        value: 20.20.2
      - key: PORT
        value: 3001
      - key: REDIS_URL
        fromService:
          type: redis
          name: codesync-redis
          property: connectionString
      - key: JWT_SECRET
        sync: false # Must match JWT_SECRET from codesync-api
      - key: CORS_ORIGIN
        sync: false # Set to your production frontend URL

  # 3. Frontend Web Client (Static Hosting)
  - type: web
    name: codesync-web
    env: static
    buildCommand: pnpm install && pnpm build --filter web
    staticPublishPath: apps/web/dist
    envVars:
      - key: VITE_API_URL
        sync: false # Set to your production API URL (e.g., https://codesync-api-okyz.onrender.com)
      - key: VITE_WS_URL
        sync: false # Set to your production WebSocket URL (e.g., https://codesync-collab-s066.onrender.com)

  # 4. Redis Instance for Socket.io adapter & BullMQ job coordination
  - type: redis
    name: codesync-redis
    plan: free
    ipAllowList: [] # RESTRICT ACCESS: empty allows only internal Render services to connect

databases:
  # PostgreSQL Database Instance
  - name: codesync-db
    databaseName: codesync
    user: codesync
    plan: free
